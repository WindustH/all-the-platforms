aes = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
jiff = { version = "0.2", features = ["serde"] }
md-5 = "0.10"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "io-util", "process"] }
tracing = "0.1"
url = "2"

[features]
# The `atp` command: every platform, and logins from local browsers.
default = ["cli"]
cli = ["all", "browser"]
# Let `login --browser` read cookies from local browsers.
browser = ["atp-core/browser"]
# Every platform, for the library; or pick them one by one below.
all = [
  "zhihu",
  "xhs",
  "twitter",
  "bilibili",
  "reddit",
  "youtube",
  "mp",
