[package]
name = "social-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One command line for Zhihu, Xiaohongshu, Twitter/X, Bilibili, Reddit and YouTube"

[[bin]]
name = "social"
path = "src/main.rs"

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
social-core = { path = "crates/social-core" }
social-zhihu = { path = "crates/social-zhihu" }
social-xhs = { path = "crates/social-xhs" }
social-twitter = { path = "crates/social-twitter" }
social-bilibili = { path = "crates/social-bilibili" }
social-reddit = { path = "crates/social-reddit" }
social-youtube = { path = "crates/social-youtube" }
social-telegram = { path = "crates/social-telegram" }

aes = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
jiff = { version = "0.2", features = ["serde"] }
md-5 = "0.10"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "io-util", "process"] }
tracing = "0.1"
url = "2"

[features]
default = ["browser"]
# Let `login --browser` read cookies from local browsers.
browser = ["social-core/browser"]

[dependencies]
social-core.workspace = true
social-zhihu.workspace = true
social-xhs.workspace = true
social-twitter.workspace = true
social-bilibili.workspace = true
social-reddit.workspace = true
social-youtube.workspace = true
social-telegram.workspace = true

[profile.release]
lto = "thin"
strip = true
