atp-quark = { path = "crates/atp-quark" }
atp-baidupan = { path = "crates/atp-baidupan" }
atp-netease = { path = "crates/atp-netease" }
atp-qqmusic = { path = "crates/atp-qqmusic" }
atp-spotify = { path = "crates/atp-spotify" }
atp-stackexchange = { path = "crates/atp-stackexchange" }
atp-hackernews = { path = "crates/atp-hackernews" }
atp-lobsters = { path = "crates/atp-lobsters" }
atp-v2ex = { path = "crates/atp-v2ex" }
atp-bangumi = { path = "crates/atp-bangumi" }
atp-podcast = { path = "crates/atp-podcast" }
atp-lemmy = { path = "crates/atp-lemmy" }
atp-rss = { path = "crates/atp-rss" }
atp-threads = { path = "crates/atp-threads" }
atp-mastodon = { path = "crates/atp-mastodon" }
atp-bluesky = { path = "crates/atp-bluesky" }
atp-discourse = { path = "crates/atp-discourse" }

aes = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
jiff = { version = "0.2", features = ["serde"] }
md-5 = "0.10"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "io-util", "process"] }
tracing = "0.1"
url = "2"

[features]
default = ["browser"]
# Let `login --browser` read cookies from local browsers.
browser = ["atp-core/browser"]

[dependencies]
atp-core.workspace = true
atp-zhihu.workspace = true
atp-xhs.workspace = true
