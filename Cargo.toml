[package]
name = "all-the-platforms"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One command line for social, video and chat platforms: Zhihu, Xiaohongshu, Weibo, Bilibili, Douyin, WeChat, Telegram, Discord, YouTube, TikTok, Reddit, Twitter/X and more"

[[bin]]
name = "atp"
path = "src/main.rs"

[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
atp-core = { path = "crates/atp-core" }
atp-zhihu = { path = "crates/atp-zhihu" }
atp-xhs = { path = "crates/atp-xhs" }
atp-twitter = { path = "crates/atp-twitter" }
atp-bilibili = { path = "crates/atp-bilibili" }
atp-reddit = { path = "crates/atp-reddit" }
atp-youtube = { path = "crates/atp-youtube" }
atp-mp = { path = "crates/atp-mp" }
atp-telegram = { path = "crates/atp-telegram" }
atp-weibo = { path = "crates/atp-weibo" }
atp-douyin = { path = "crates/atp-douyin" }
atp-discord = { path = "crates/atp-discord" }
atp-tieba = { path = "crates/atp-tieba" }
atp-tiktok = { path = "crates/atp-tiktok" }
atp-wechat = { path = "crates/atp-wechat" }
atp-feishu = { path = "crates/atp-feishu" }
atp-dingtalk = { path = "crates/atp-dingtalk" }
atp-wecom = { path = "crates/atp-wecom" }
atp-slack = { path = "crates/atp-slack" }
atp-mattermost = { path = "crates/atp-mattermost" }
atp-rocketchat = { path = "crates/atp-rocketchat" }
atp-onebot = { path = "crates/atp-onebot" }
atp-kook = { path = "crates/atp-kook" }
atp-satori = { path = "crates/atp-satori" }
atp-qq = { path = "crates/atp-qq" }
atp-misskey = { path = "crates/atp-misskey" }
atp-matrix = { path = "crates/atp-matrix" }
atp-vocechat = { path = "crates/atp-vocechat" }
atp-line = { path = "crates/atp-line" }
atp-meta = { path = "crates/atp-meta" }
atp-bytedance = { path = "crates/atp-bytedance" }
atp-facebook = { path = "crates/atp-facebook" }
atp-instagram = { path = "crates/atp-instagram" }
atp-whatsapp = { path = "crates/atp-whatsapp" }
atp-kuaishou = { path = "crates/atp-kuaishou" }
atp-toutiao = { path = "crates/atp-toutiao" }
atp-alibaba = { path = "crates/atp-alibaba" }
atp-xianyu = { path = "crates/atp-xianyu" }
atp-taobao = { path = "crates/atp-taobao" }
atp-amap = { path = "crates/atp-amap" }
atp-jd = { path = "crates/atp-jd" }
atp-pinduoduo = { path = "crates/atp-pinduoduo" }
atp-dewu = { path = "crates/atp-dewu" }

aes = "0.8"
base64 = "0.22"
cbc = "0.1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
jiff = { version = "0.2", features = ["serde"] }
md-5 = "0.10"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "io-util", "process"] }
tracing = "0.1"
url = "2"

[features]
default = ["browser"]
# Let `login --browser` read cookies from local browsers.
browser = ["atp-core/browser"]

[dependencies]
atp-core.workspace = true
atp-zhihu.workspace = true
atp-xhs.workspace = true
atp-twitter.workspace = true
atp-bilibili.workspace = true
atp-reddit.workspace = true
atp-youtube.workspace = true
atp-mp.workspace = true
atp-telegram.workspace = true
atp-weibo.workspace = true
atp-douyin.workspace = true
atp-discord.workspace = true
atp-tieba.workspace = true
atp-tiktok.workspace = true
atp-wechat.workspace = true
atp-feishu.workspace = true
atp-dingtalk.workspace = true
atp-wecom.workspace = true
atp-slack.workspace = true
atp-mattermost.workspace = true
atp-rocketchat.workspace = true
atp-onebot.workspace = true
atp-kook.workspace = true
atp-satori.workspace = true
atp-qq.workspace = true
atp-misskey.workspace = true
atp-matrix.workspace = true
atp-vocechat.workspace = true
atp-line.workspace = true
atp-facebook.workspace = true
atp-instagram.workspace = true
atp-whatsapp.workspace = true
atp-kuaishou.workspace = true
atp-toutiao.workspace = true
atp-xianyu.workspace = true
atp-taobao.workspace = true
atp-amap.workspace = true
atp-jd.workspace = true
atp-pinduoduo.workspace = true
atp-dewu.workspace = true

[profile.release]
lto = "thin"
strip = true
