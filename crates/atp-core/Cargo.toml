[package]
name = "atp-core"
description = "Platform-agnostic kernel of all-the-platforms: models, HTTP, sessions, output and the shared command set"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Import login cookies from local browsers (`login --browser`).
browser = ["dep:rookie"]

[dependencies]
anstyle-query = "1"
clap.workspace = true
comfy-table = "8"
csv = "1"
dirs = "6"
futures-util = "0.3"
html2text = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
imagesize = "0.14"
indicatif = "0.18"
jiff.workspace = true
libc = "0.2"
md-5.workspace = true
owo-colors = { version = "4", features = ["supports-colors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand.workspace = true
rqrr = { version = "0.11", default-features = false }
rookie = { version = "0.5", optional = true }
serde.workspace = true
serde-saphyr = "1"
serde_json.workspace = true
sha1 = { workspace = true, features = ["compress"] }
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url.workspace = true
wreq = { version = "6.0.0-rc.31", features = ["json", "form", "query", "multipart", "stream", "cookies", "gzip", "brotli", "deflate", "zstd", "socks", "ws"] }
wreq-util = "3.0.0-rc.14"
