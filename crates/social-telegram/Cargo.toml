[package]
name = "social-telegram"
description = "Telegram support for social-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
grammers-client = "0.10"
grammers-mtsender = { version = "0.10", features = ["proxy"] }
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-tl-types = "0.10"
jiff.workspace = true
libc = "0.2"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
social-core.workspace = true
tokio = { workspace = true, features = ["sync", "net"] }
tracing.workspace = true
url.workspace = true
