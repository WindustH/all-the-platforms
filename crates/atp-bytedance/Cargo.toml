[package]
name = "atp-bytedance"
description = "What all-the-platforms's ByteDance sites (Douyin, Toutiao, Juejin, TikTok) share: a_bogus signing, visitor cookies, the passports, ticket-guard keys, the webcast live protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atp-core.workspace = true
base64.workspace = true
# BoringSSL, already built for the HTTP client (wreq): ECDH with a stored P-256 key, which ring does not offer.
btls = "0.5.6"
flate2 = "1"
hmac = "0.12"
jiff.workspace = true
md-5.workspace = true
rand.workspace = true
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sm3 = "0.5"
tracing.workspace = true
url.workspace = true
